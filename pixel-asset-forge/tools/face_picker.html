<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<!-- compose_face.py --html が部品のデータを埋め込んで書き出すページの元。直接は開かない -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #eceef3;
  --panel: #ffffff;
  --ink: #1a1228;
  --muted: #5b5f72;
  --line: #d3d6e0;
  --accent: #4a63a6;
  --accent-soft: #dfe5f4;
  --warn: #9a5b12;
  --warn-soft: #fbecd6;
  --stage: #3a3c4a;
  --talk: #f7f3e6;
  --bar: #18222c;
  --dot: "DotGothic16", "Osaka-Mono", "MS Gothic", monospace;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #14161d; --panel: #1d2029; --ink: #e8e9f0; --muted: #a3a7b8; --line: #333747;
    --accent: #8ea4e6; --accent-soft: #252d45; --warn: #f0b765; --warn-soft: #3a2c17;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14161d; --panel: #1d2029; --ink: #e8e9f0; --muted: #a3a7b8; --line: #333747;
  --accent: #8ea4e6; --accent-soft: #252d45; --warn: #f0b765; --warn-soft: #3a2c17;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; margin-bottom: 18px; }
h1 { font-family: var(--dot); font-weight: 400; font-size: 28px; margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: 14px; }
.jump { font-size: 14px; color: var(--accent); }
.filter { font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.layout { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 14px; }
@media (max-width: 860px) { .preview { position: static; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
.stage { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.big { width: 256px; height: 256px; max-width: 100%; aspect-ratio: 1; background: var(--stage); image-rendering: pixelated; display: block; }
.ref { display: grid; gap: 4px; }
.ref img { width: 128px; height: 128px; image-rendering: pixelated; background: var(--stage); display: block; object-fit: contain; }
.cap { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.frames { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; margin-top: 12px; }
.frame { display: grid; gap: 4px; justify-items: start; }
.frame .box { display: grid; place-items: center; padding: 8px; }
.frame.talk .box { background: var(--talk); }
.frame.bar .box { background: var(--bar); }
.frame canvas { image-rendering: pixelated; display: block; }
.code-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.code { font-family: var(--dot); font-size: 22px; letter-spacing: 0.06em; user-select: all; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 4px 12px; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.copied { font-size: 12px; color: var(--accent); min-width: 6em; }
.chosen { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 13px; }
.chosen b { font-weight: 700; display: inline-block; min-width: 5.5em; color: var(--muted); }
.warn { margin-top: 10px; background: var(--warn-soft); color: var(--warn); border-radius: 4px; padding: 6px 10px; font-size: 13px; }
.groups { display: grid; gap: 16px; }
.group h2 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; }
.group h2 .now { font-weight: 400; color: var(--muted); font-size: 13px; }
.opts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .opts { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.opt { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 6px; display: grid; gap: 4px; justify-items: center; text-align: center; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.opt canvas { width: 64px; height: 64px; image-rendering: pixelated; background: var(--stage); display: block; }
.opt .id { font-family: var(--dot); font-size: 14px; }
.opt .lab { font-size: 11px; line-height: 1.35; color: var(--muted); }
.note { color: var(--muted); font-size: 13px; margin: 18px 0 0; max-width: 65ch; }
.matrix { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 24px; }
.matrix > h2 { font-family: var(--dot); font-weight: 400; font-size: 22px; margin: 0 0 4px; }
.matrix > p { color: var(--muted); margin: 0 0 16px; font-size: 14px; max-width: 65ch; }
.psets { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 430px), 1fr)); gap: 24px; }
.pset h3 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; }
.pset h3 .now { font-weight: 400; color: var(--muted); font-size: 13px; }
.scroll { overflow-x: auto; }
table.grid { border-collapse: separate; border-spacing: 4px; }
table.grid th { font-family: var(--dot); font-weight: 400; font-size: 13px; color: var(--muted); padding: 0 2px; }
table.grid td { padding: 0; }
.cell { display: block; padding: 3px; border: 1px solid transparent; border-radius: 3px; background: var(--talk); }
.cell canvas { width: 64px; height: 64px; image-rendering: pixelated; display: block; }
.cell:hover { border-color: var(--accent); }
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cell[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.cell.hidden-part { border-style: dashed; border-color: var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>__TITLE__</h1>
    <p class="sub"><span id="counts"></span> ― <span id="total"></span>通り</p>
    <label class="filter" id="filter-box" hidden><input type="checkbox" id="filter" checked> 候補だけ表示</label>
    <a class="jump" id="jump" href="#matrix" hidden></a>
  </header>
  <div class="layout">
    <section class="preview" aria-label="組み合わせた顔">
      <div class="card">
        <div class="stage">
          <canvas id="big" class="big" aria-label="8倍"></canvas>
          <div class="ref" id="ref-box" hidden>
            <img id="ref" alt="見本">
            <span class="cap">見本</span>
          </div>
        </div>
        <div class="frames">
          <div class="frame talk"><div class="box"><canvas id="x2"></canvas></div><span class="cap" id="cap-x2"></span></div>
          <div class="frame bar"><div class="box"><canvas id="x1"></canvas></div><span class="cap" id="cap-x1"></span></div>
          <span class="cap">上の大きい絵は8倍</span>
        </div>
      </div>
      <div class="card">
        <div class="code-row">
          <span class="code" id="code"></span>
          <button class="btn" id="copy" type="button">記号をコピー</button>
          <button class="btn" id="random" type="button">おまかせ</button>
          <span class="copied" id="copied" aria-live="polite"></span>
        </div>
        <ul class="chosen" id="chosen"></ul>
        <div class="warn" id="warn" hidden></div>
      </div>
    </section>
    <section class="groups" id="groups" aria-label="部品を選ぶ"></section>
  </div>
  <section class="matrix" id="matrix" hidden>
    <h2 id="matrix-title"></h2>
    <p id="matrix-note"></p>
    <div class="psets" id="psets"></div>
  </section>
  <p class="note" id="note"></p>
</div>

<script>
const DATA = __DATA__;
const REF = "__REF__";
const [W, H] = DATA.size;
const PICKER = DATA.picker || {};
const SHORT = PICKER.shortlist || {};

function variantsOf(el) { return el === "balance" ? DATA.balance : DATA.elements[el].variants; }
function labelOf(el) { return el === "balance" ? "バランス" : DATA.elements[el].label; }
// 記号に並べる要素（parts.json の picker.pick_order。無ければ案が2つ以上ある要素とバランス）
const ELEMENTS = PICKER.pick_order || [
  ...Object.keys(DATA.elements).filter((el) => Object.keys(variantsOf(el)).length > 1), "balance"];
const state = { ...DATA.default };
const filterBox = document.getElementById("filter");
function useShort() { return Object.keys(SHORT).length > 0 && filterBox.checked; }
// 表示する案: 候補だけ表示のときは候補と、今選んでいる案
function shown(el) {
  const all = Object.keys(variantsOf(el));
  if (!useShort() || !SHORT[el]) return all;
  return all.filter((id) => SHORT[el].includes(id) || id === state[el]);
}

function compose(pick) {
  const img = new ImageData(W, H);
  const put = (list) => {
    for (const [x, y, hex] of list) {
      const i = (y * W + x) * 4;
      img.data[i] = parseInt(hex.slice(1, 3), 16);
      img.data[i + 1] = parseInt(hex.slice(3, 5), 16);
      img.data[i + 2] = parseInt(hex.slice(5, 7), 16);
      img.data[i + 3] = 255;
    }
  };
  put(DATA.base);
  for (const el of DATA.order) {
    const leader = DATA.follow[el] || el;
    const layer = DATA.layers[`${el}|${pick[leader]}|${pick.balance}`];
    if (layer) put(layer);
  }
  return img;
}

const scratch = document.createElement("canvas");
scratch.width = W; scratch.height = H;
const sctx = scratch.getContext("2d");
function draw(canvas, img) {
  sctx.putImageData(img, 0, 0);
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(scratch, 0, 0, canvas.width, canvas.height);
}
function sizeCanvas(id, scale) {
  const c = document.getElementById(id);
  c.width = W * scale; c.height = H * scale;
  c.style.width = `${W * scale}px`; c.style.height = `${H * scale}px`;
}
const big = document.getElementById("big");
big.width = W * 8; big.height = H * 8;
sizeCanvas("x2", 2); sizeCanvas("x1", 1);
document.getElementById("cap-x2").textContent = `${W * 2}px の枠（2倍）`;
document.getElementById("cap-x1").textContent = `${W}px の枠（等倍）`;

// 部品を選ぶボタン
const groups = document.getElementById("groups");
const buttons = {};
for (const el of ELEMENTS) {
  const sec = document.createElement("div");
  sec.className = "group";
  sec.innerHTML = `<h2><span>${labelOf(el)}</span><span class="now" id="now-${el}"></span></h2>`;
  const row = document.createElement("div");
  row.className = "opts";
  buttons[el] = {};
  for (const [id, label] of Object.entries(variantsOf(el))) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt"; b.id = `opt-${el}-${id}`;
    b.setAttribute("aria-pressed", "false");
    const c = document.createElement("canvas");
    c.width = W * 2; c.height = H * 2;
    b.append(c);
    b.insertAdjacentHTML("beforeend", `<span class="id">${id}</span><span class="lab">${label}</span>`);
    b.addEventListener("click", () => { state[el] = id; render(); });
    row.append(b);
    buttons[el][id] = { b, c };
  }
  sec.append(row);
  groups.append(sec);
}

function codeOf(pick) { return ELEMENTS.map((el) => pick[el]).join("-"); }

// 3つの要素の一覧（picker.matrix: groups ごとに表、行 rows・列 cols）。ほかは上で選んだもの
const MATRIX = PICKER.matrix;
const cells = [];
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function buildMatrix() {
  if (!MATRIX) return;
  const { groups: G, rows: R, cols: C } = MATRIX;
  const psets = document.getElementById("psets");
  psets.innerHTML = "";
  cells.length = 0;
  for (const g of shown(G)) {
    const box = document.createElement("div");
    box.className = "pset";
    box.innerHTML = `<h3><span>${g}</span><span class="now">${variantsOf(G)[g]}</span></h3>`;
    const table = document.createElement("table");
    table.className = "grid";
    const head = table.createTHead().insertRow();
    head.append(document.createElement("th"));
    for (const c of shown(C)) {
      const th = document.createElement("th");
      th.scope = "col"; th.textContent = c; th.title = variantsOf(C)[c];
      head.append(th);
    }
    const body = table.createTBody();
    for (const r of shown(R)) {
      const row = body.insertRow();
      const th = document.createElement("th");
      th.scope = "row"; th.textContent = r; th.title = variantsOf(R)[r];
      row.append(th);
      for (const c of shown(C)) {
        const btn = document.createElement("button");
        btn.type = "button"; btn.className = "cell";
        btn.setAttribute("aria-label", `${r}・${c}・${g}`);
        const cv = document.createElement("canvas");
        cv.width = W * 2; cv.height = H * 2;
        btn.append(cv);
        btn.addEventListener("click", () => {
          Object.assign(state, { [G]: g, [R]: r, [C]: c });
          render();
          window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
        });
        row.insertCell().append(btn);
        cells.push({ pick: { [G]: g, [R]: r, [C]: c }, btn, cv });
      }
    }
    const scroll = document.createElement("div");
    scroll.className = "scroll";
    scroll.append(table);
    box.append(scroll);
    psets.append(box);
  }
}
function hiddenMsg(pick) {
  const out = [];
  for (const lower of ["eyes", "brows"]) {
    if (!(lower in DATA.elements)) continue;
    const hit = DATA.hidden[`${lower}|${pick[lower]}|${pick.hair}|${pick.balance}`];
    if (hit) out.push(`前髪が${labelOf(lower)}を ${hit[0]}/${hit[1]} 升隠しています`);
  }
  return out;
}
function renderMatrix() {
  if (!MATRIX) return;
  const fixed = ELEMENTS.filter((el) => !Object.values(MATRIX).includes(el))
    .map((el) => `${labelOf(el)} ${state[el]}`).join("・");
  document.getElementById("matrix-note").textContent =
    `${fixed} で固定（上で選び直すと変わります）。${W * 2}px の枠（2倍）で表示。押すとその組み合わせを上に入れます。点線の枠は、前髪が目か眉を一部隠している組み合わせです。`;
  for (const { pick, btn, cv } of cells) {
    const full = { ...state, ...pick };
    draw(cv, compose(full));
    btn.setAttribute("aria-current", String(Object.entries(pick).every(([k, v]) => state[k] === v)));
    const msgs = hiddenMsg(full);
    btn.classList.toggle("hidden-part", msgs.length > 0);
    btn.title = btn.getAttribute("aria-label") + (msgs.length ? `（${msgs.join("。")}）` : "");
  }
}

function render() {
  const img = compose(state);
  draw(big, img);
  draw(document.getElementById("x2"), img);
  draw(document.getElementById("x1"), img);
  document.getElementById("code").textContent = codeOf(state);
  const chosen = document.getElementById("chosen");
  chosen.innerHTML = "";
  for (const el of ELEMENTS) {
    const li = document.createElement("li");
    li.innerHTML = `<b>${labelOf(el)}</b>${state[el]}　${variantsOf(el)[state[el]]}`;
    chosen.append(li);
    document.getElementById(`now-${el}`).textContent = `${state[el]}　${variantsOf(el)[state[el]]}`;
    const visible = shown(el);
    for (const [id, { b, c }] of Object.entries(buttons[el])) {
      b.hidden = !visible.includes(id);
      b.setAttribute("aria-pressed", String(id === state[el]));
      if (!b.hidden) draw(c, compose({ ...state, [el]: id }));
    }
  }
  const msgs = hiddenMsg(state);
  const warn = document.getElementById("warn");
  warn.hidden = msgs.length === 0;
  warn.textContent = msgs.join("。");
  renderMatrix();
}

function updateCounts() {
  document.getElementById("counts").textContent = ELEMENTS
    .map((el) => `${labelOf(el)}${shown(el).length}`).join("・") + "案";
  document.getElementById("total").textContent = ELEMENTS
    .reduce((n, el) => n * shown(el).length, 1).toLocaleString("ja-JP");
}

document.getElementById("random").addEventListener("click", () => {
  for (const el of ELEMENTS) {
    const ids = shown(el);
    state[el] = ids[Math.floor(Math.random() * ids.length)];
  }
  buildMatrix(); updateCounts(); render();
});
document.getElementById("copy").addEventListener("click", () => {
  const text = codeOf(state);
  const done = (msg) => { document.getElementById("copied").textContent = msg; };
  function select() {
    const r = document.createRange();
    r.selectNodeContents(document.getElementById("code"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    done("選択しました");
  }
  try {
    navigator.clipboard.writeText(text).then(() => done("コピーしました"), select);
  } catch (e) { select(); }
});
filterBox.addEventListener("change", () => { buildMatrix(); updateCounts(); render(); });

if (Object.keys(SHORT).length) document.getElementById("filter-box").hidden = false;
if (REF) {
  document.getElementById("ref").src = REF;
  document.getElementById("ref-box").hidden = false;
}
if (MATRIX) {
  const title = `${labelOf(MATRIX.rows)}×${labelOf(MATRIX.cols)}×${labelOf(MATRIX.groups)}の一覧`;
  document.getElementById("matrix-title").textContent = title;
  const jump = document.getElementById("jump");
  jump.textContent = `${title}へ`;
  jump.hidden = false;
  document.getElementById("matrix").hidden = false;
}
const fixedEls = Object.keys(DATA.elements).filter((el) => !ELEMENTS.includes(el));
const followEls = Object.entries(DATA.follow || {});
document.getElementById("note").textContent = "気に入った組み合わせは、上の記号をそのまま伝えてください。"
  + (fixedEls.length ? `${fixedEls.map((el) => `${labelOf(el)}は ${DATA.default[el]}`).join("、")} で固定です。` : "")
  + (followEls.length ? `${followEls.map(([, l]) => labelOf(l)).join("・")}の案に連動する層があります。` : "");
buildMatrix(); updateCounts(); render();
</script>
</body>
</html>
